<rect x="103.94" y="634.96" class="st0" width="812.07" height="66.84"/>
<text transform="matrix(1 0 0 1 103.9429 642.6318)"><tspan x="0" y="0" class="st1 st2">After DNA fragmentation, the following orientations of adapters is necessary to amplify the DNA. Note that a 72° </tspan><tspan x="0" y="14.4" class="st1 st2">extention step preceeds denaturation in the PCR protocol in order to generate the complement sequence of the PCR </tspan><tspan x="0" y="28.8" class="st1 st2">primers. The sequencing primers are also included (Read 1 sequencing primer is PE1). Therefore, if PE1 or PE2 </tspan><tspan x="0" y="43.2" class="st1 st2">aligns to the plus strand a shift of +4 is needed and a shift or -5 is needed if either PE1 or PE2 aligns to the </tspan><tspan x="0" y="57.6" class="st1 st2">minus strand.</tspan></text>
