#footer #site-generator>a { display:none; }#site-generator a {
    background-image: none;

}

    margin: 0;

			img {
  max-width: 100%;
  height: auto;
}

#branding img {
border-top: 0px solid #000;
border-bottom: 0px solid #000;
display: block;

}

background:none repeat scroll 0 0 #001641;
}

		</style>

<body class="{% if page.url == '/' %}home {% endif %}page-template page-template-onecolumn-page page-template-onecolumn-page-php page custom-background">
<div class="hfeed" id="wrapper">
<a class="screen-reader-text skip-link" href="#content">Skip to content</a>
<div id="header">
<div id="masthead">
<div id="branding" role="banner">
<h1 id="site-title">
<span>
<a aria-current="page" href="/" rel="home">Guertin Lab</a>
</span>
</h1>
<div id="site-description">genomics and gene regulation</div>
<img alt="Guertin Lab" height="" src="/wp-content/uploads/2021/07/lab_website_logo2-5.svg" width=""/> </div><!-- #branding -->
<div id="access" role="navigation">
<div class="menu-header"><ul class="menu" id="menu-primary-menu">{% for item in site.data.nav %}<li class="page_item{% if page.url == item.url %} current_page_item{% endif %}"><a href="{{ item.url }}">{{ item.title }}</a></li>{% endfor %}</ul></div> </div><!-- #access -->
</div><!-- #masthead -->
</div><!-- #header -->
<div id="main">
<div class="one-column" id="container">
<div id="content" role="main"><div class="page type-page status-publish hentry">
{% if page.url != '/' %}<h1 class="entry-title">{{ page.title }}</h1>{% endif %}
<div class="entry-content">
{{ content }}
</div><!-- .entry-content -->
</div></div><!-- #content -->
</div><!-- #container -->
</div><!-- #main -->
<div id="footer" role="contentinfo">
<div id="colophon">
<div id="site-info">
<a href="/" rel="home">
					Guertin Lab				</a>
</div><!-- #site-info -->
<!-- #site-generator -->
</div><!-- #colophon -->
</div><!-- #footer -->
</div><!-- #wrapper -->
